name: Build Nothing 3a Pro Kernel (Wild KSU + SuSFS)

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: 'Kernel version suffix (e.g. 6.1.175)'
        required: false
        default: '6.1.134'
      ksu_branch:
        description: 'Wild_KSU branch/tag to use'
        required: false
        default: 'dev'
      susfs_enabled:
        description: 'Enable SuSFS'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      release:
        description: 'Create GitHub Release'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

# ─── tunables ─────────────────────────────────────────────────────────────────
env:
  KERNEL_REPO: ${{ github.repository }}
  KERNEL_BRANCH: sm7635/v/mr
  DEVICE_CODENAME: asteroids
  ARCH: arm64
  SUBARCH: arm64
  KERNEL_IMAGE: Image

  # Toolchain — AOSP Clang r547379 (Clang 18) — stock used 17.0.2 but 18 is available and compatible
  CLANG_VERSION: r547379
  CLANG_URL: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r547379.tar.gz

  # Wild KSU
  WILDKSU_REPO: WildKernels/Wild_KSU

  # SuSFS
  SUSFS_REPO: simonpunk/susfs4ksu
  SUSFS_BRANCH: gki-android15-6.1

  # WildKernels patches
  WK_PATCHES_REPO: WildKernels/kernel_patches

  # AnyKernel3 — use canonical osm0sis upstream (WildKernels fork may not exist)
  AK3_REPO: https://github.com/osm0sis/AnyKernel3
  AK3_BRANCH: master

  OUT_DIR: out
  CCACHE_DIR: ${{ github.workspace }}/.ccache
# ──────────────────────────────────────────────────────────────────────────────

jobs:
  build:
    name: Build Kernel - Nothing 3a Pro (SM7635)
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout kernel source ──────────────────────────────────────────
      - name: Checkout Nothing kernel source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_REPO }}
          ref: ${{ env.KERNEL_BRANCH }}
          fetch-depth: 1

      # ── 2. Resolve dependency SHAs (used as cache keys) ───────────────────
      - name: Resolve dependency SHAs
        id: shas
        run: |
          resolve() {
            # Accepts owner/repo, ref — matches branches and tags
            local repo=$1 ref=$2
            git ls-remote "https://github.com/${repo}.git" \
              "refs/heads/${ref}" "refs/tags/${ref}" \
              | head -1 | cut -f1
          }
          resolve_gl() {
            local repo=$1 ref=$2
            git ls-remote "https://gitlab.com/${repo}.git" \
              "refs/heads/${ref}" "refs/tags/${ref}" \
              | head -1 | cut -f1
          }

          KSU_SHA=$(resolve "${{ env.WILDKSU_REPO }}" "${{ github.event.inputs.ksu_branch }}")
          SUSFS_SHA=""
          for branch in ${{ env.SUSFS_BRANCH }} kernel-6.1 gki-android14-6.1 main; do
            SUSFS_SHA=$(resolve_gl "${{ env.SUSFS_REPO }}" "$branch")
            [ -n "$SUSFS_SHA" ] && break
          done
          WKP_SHA=$(resolve "${{ env.WK_PATCHES_REPO }}" main)
          AK3_SHA=$(resolve "osm0sis/AnyKernel3" "${{ env.AK3_BRANCH }}")

          echo "ksu=${KSU_SHA}"     >> $GITHUB_OUTPUT
          echo "susfs=${SUSFS_SHA}" >> $GITHUB_OUTPUT
          echo "wkp=${WKP_SHA}"     >> $GITHUB_OUTPUT
          echo "ak3=${AK3_SHA}"     >> $GITHUB_OUTPUT

          echo "Wild_KSU  : ${KSU_SHA}"
          echo "susfs4ksu : ${SUSFS_SHA}"
          echo "wk_patches: ${WKP_SHA}"
          echo "AnyKernel3: ${AK3_SHA}"

      # ── 3. Install host dependencies ───────────────────────────────────────
      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-${{ runner.os }}-build-deps-v3
          restore-keys: apt-${{ runner.os }}-

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates ccache cpio curl \
            flex git kmod libelf-dev libssl-dev lz4 \
            python3 python3-pip rsync unzip xz-utils zstd \
            device-tree-compiler binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi dwarves

      # ── 4. Cache Clang toolchain ───────────────────────────────────────────
      - name: Cache Clang toolchain
        id: clang-cache
        uses: actions/cache@v4
        with:
          path: clang
          key: clang-${{ env.CLANG_VERSION }}

      - name: Download Clang toolchain
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p clang
          curl -LSs "${{ env.CLANG_URL }}" | tar -xz -C clang

      - name: Add Clang to PATH
        run: |
          echo "$PWD/clang/bin" >> $GITHUB_PATH
          echo "CC=ccache clang" >> $GITHUB_ENV
          echo "LD=ld.lld" >> $GITHUB_ENV
          echo "AR=llvm-ar" >> $GITHUB_ENV
          echo "NM=llvm-nm" >> $GITHUB_ENV
          echo "OBJCOPY=llvm-objcopy" >> $GITHUB_ENV
          echo "OBJDUMP=llvm-objdump" >> $GITHUB_ENV
          echo "STRIP=llvm-strip" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV

      # ── 5. Set up ccache ──────────────────────────────────────────────────
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ env.CLANG_VERSION }}-${{ env.KERNEL_BRANCH }}-${{ github.event.inputs.ksu_branch }}-${{ github.event.inputs.susfs_enabled }}
          restore-keys: |
            ccache-${{ env.CLANG_VERSION }}-${{ env.KERNEL_BRANCH }}-
            ccache-${{ env.CLANG_VERSION }}-

      - name: Configure ccache
        run: |
          ccache --max-size=5G
          ccache --zero-stats
          echo "CCACHE_EXEC=$(which ccache)" >> $GITHUB_ENV

      # ── 6. Apply Wild KSU ─────────────────────────────────────────────────
      - name: Cache Wild_KSU
        id: wildksu-cache
        uses: actions/cache@v4
        with:
          path: Wild_KSU
          key: wildksu-${{ steps.shas.outputs.ksu }}

      - name: Clone Wild_KSU
        if: steps.wildksu-cache.outputs.cache-hit != 'true'
        run: |
          git clone \
            -b ${{ github.event.inputs.ksu_branch }} \
            https://github.com/${{ env.WILDKSU_REPO }} \
            Wild_KSU
          # Full clone (no --depth=1) so git describe/rev-list resolve real
          # tags and commit counts — Kbuild's version detection needs this,
          # and its own auto-unshallow fallback fails silently (`|| true`).

      - name: Verify Wild_KSU git version resolves
        run: |
          cd Wild_KSU
          echo "HEAD: $(git rev-parse HEAD)"
          echo "rev-list --count: $(git rev-list --count HEAD)"
          echo "describe --tags: $(git describe --tags --abbrev=0 2>&1)"
          if [ -f .git/shallow ]; then
            echo "::error::Wild_KSU is still a shallow clone — KSU version will be abnormal"
            exit 1
          fi

      - name: Show Wild_KSU layout
        run: |
          echo "=== Wild_KSU top-level ==="
          ls -la Wild_KSU/
          echo "=== kernel/ subdir (if present) ==="
          ls -la Wild_KSU/kernel/ 2>/dev/null || echo "(no kernel/ subdir found)"

      - name: Integrate Wild KSU into kernel tree
        run: |
          # Use setup.sh if the repo ships one (most KSU forks do)
          if [ -f Wild_KSU/kernel/setup.sh ]; then
            echo "Using Wild_KSU/kernel/setup.sh"
            bash Wild_KSU/kernel/setup.sh "${{ github.event.inputs.ksu_branch }}"
          elif [ -f Wild_KSU/setup.sh ]; then
            echo "Using Wild_KSU/setup.sh"
            bash Wild_KSU/setup.sh -
          else
            # Manual copy: prefer kernel/ subdir, fall back to repo root
            if [ -d Wild_KSU/kernel ] && [ -f Wild_KSU/kernel/Makefile ]; then
              KSU_SRC=Wild_KSU/kernel
            elif [ -f Wild_KSU/Makefile ]; then
              KSU_SRC=Wild_KSU
            else
              echo "::error::Cannot locate Wild KSU kernel driver — unexpected repo layout:"
              find Wild_KSU -maxdepth 2 | head -40
              exit 1
            fi
            echo "Copying KSU driver from: $KSU_SRC"
            cp -r "$KSU_SRC" drivers/kernelsu
          fi

          # Wire into build system (guard against duplicate entries)
          grep -qxF 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig \
            || echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
          grep -qxF 'obj-$(CONFIG_KSU) += kernelsu/' drivers/Makefile \
            || echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile

          # ── Diagnostic: show what setup.sh installed ────────────────────
          echo "=== drivers/kernelsu/ layout ==="
          ls -la drivers/kernelsu/
          echo "=== Kbuild (raw) ==="
          cat drivers/kernelsu/Kbuild 2>/dev/null || echo "(no Kbuild)"
          echo "=== ksu.c includes ==="
          grep -n "#include" drivers/kernelsu/ksu.c 2>/dev/null | head -50 || echo "(no ksu.c)"
          echo "=== sucompat.c function signatures ==="
          grep -n "^static\|^void ksu_\|^int ksu_\|^bool ksu_" drivers/kernelsu/sucompat.c 2>/dev/null | head -40 || echo "(no sucompat.c)"
          echo "=== ksu_cred occurrences ==="
          grep -rn "ksu_cred" drivers/kernelsu/ 2>/dev/null | head -20 || echo "(none)"
          echo "=== disable_seccomp occurrences ==="
          grep -rn "disable_seccomp" drivers/kernelsu/ 2>/dev/null | head -20 || echo "(none)"

          # ── Fix: remove duplicate #include "hook/lsm_hook.c" ───────────
          if [ -f drivers/kernelsu/ksu.c ]; then
            awk '/^#include "hook\/lsm_hook\.c"$/{if(seen){print "// duplicate lsm_hook.c include removed"; next}; seen=1} 1' \
              drivers/kernelsu/ksu.c > /tmp/ksu_c_fixed.c \
              && mv /tmp/ksu_c_fixed.c drivers/kernelsu/ksu.c \
              && echo "Processed ksu.c for duplicate lsm_hook.c include" \
              || echo "awk processing failed — leaving ksu.c unchanged"
          else
            echo "ksu.c not found — skipping duplicate include fix"
          fi

          # ── Fix: sucompat compilation — neither double-compiled nor absent
          KBUILD_SUCOMPAT=$(grep -c "sucompat\.o" drivers/kernelsu/Kbuild 2>/dev/null || echo 0)
          KSU_C_INCLUDES=$(grep -c '#include "sucompat\.c"' drivers/kernelsu/ksu.c 2>/dev/null || echo 0)
          echo "Kbuild has sucompat.o: $KBUILD_SUCOMPAT | ksu.c includes sucompat.c: $KSU_C_INCLUDES"
          if [ "$KBUILD_SUCOMPAT" -gt 0 ] && [ "$KSU_C_INCLUDES" -gt 0 ]; then
            echo "Double-compilation: removing sucompat.o from Kbuild (ksu.c already #includes it)"
            sed -i '/sucompat\.o/d' drivers/kernelsu/Kbuild
          fi
          # setuid_hook.c doesn't exist in Wild KSU dev — remove from Kbuild
          sed -i '/setuid_hook\.o/d' drivers/kernelsu/Kbuild 2>/dev/null || true

          # ── Fix: strip static from sucompat hook functions ─────────────
          # ksu_handle_stat, ksu_handle_faccessat, ksu_handle_execveat_sucompat
          # are all still undefined — previous regex didn't match the actual
          # attribute pattern. Use a simpler approach: any line that (a) contains
          # one of the target function names AND (b) starts with 'static' has the
          # leading 'static ' removed, regardless of attributes in between.
          if [ -f drivers/kernelsu/sucompat.c ]; then
            python3 -c "f='drivers/kernelsu/sucompat.c'; targets=['ksu_handle_stat','ksu_handle_faccessat','ksu_handle_execveat_sucompat','ksu_handle_execve_sucompat']; lines=open(f).readlines(); out=[l.replace('static ','',1) if any(t in l for t in targets) and l.lstrip().startswith('static') else l for l in lines]; open(f,'w').writelines(out); print('static stripped from {} lines in sucompat.c'.format(sum(1 for a,b in zip(lines,out) if a!=b)))"
          fi

          # ── Fix: disable_seccomp stub ───────────────────────────────────
          # hook/lsm_hook.c:54,61 calls disable_seccomp() inside ksu_task_fix_setuid
          # (lsm_hook.c is #included into ksu.c). setuid_hook.c which defines it
          # doesn't exist in Wild KSU dev branch. Add empty stub before the include.
          if grep -q 'disable_seccomp' drivers/kernelsu/hook/lsm_hook.c 2>/dev/null; then
            sed -i 's|#include "hook/lsm_hook.c"|static void disable_seccomp(void) {}\n#include "hook/lsm_hook.c"|' \
              drivers/kernelsu/ksu.c \
              && echo "Added disable_seccomp stub before hook/lsm_hook.c include" \
              || echo "Could not patch ksu.c for disable_seccomp stub"
          fi

          # ── Fix: ksu_cred + weak stubs for sucompat hook functions ────────
          # sucompat.c lines 111/120/146 have non-static definitions — Python
          # correctly reported 'no match'. The real problem: the #include
          # "sucompat.c" at ksu.c:43 is likely inside a #ifdef guard (e.g.
          # CONFIG_KSU_SUCOMPAT) that isn't set in our .config, so the functions
          # never get compiled. Fix with __weak stubs: linker uses the strong
          # sucompat.c definition when available, falls back to stub otherwise.
          if ! grep -rqE "^const struct cred \*ksu_cred|^struct cred \*ksu_cred" drivers/kernelsu/ 2>/dev/null; then
            echo "ksu_cred not defined anywhere — adding compat stubs file"
          fi
          printf '%s\n' \
            '#include <linux/types.h>' \
            '#include <linux/cred.h>' \
            '#include <linux/fs.h>' \
            '' \
            'const struct cred *ksu_cred;' \
            '' \
            '/* Weak stubs: used only when sucompat.c is compiled out (ifdef guard).*/' \
            '/* If sucompat.c IS compiled, the linker prefers those strong defs.  */' \
            '__weak int ksu_handle_faccessat(int *dfd, const char __user **f, int *mode, int *fl) { return 0; }' \
            '__weak int ksu_handle_stat(int *dfd, const char __user **f, int *fl) { return 0; }' \
            '__weak int ksu_handle_execveat_sucompat(int *fd, struct filename **fp, void *argv, void *envp, int *fl) { return 0; }' \
            > drivers/kernelsu/ksu_compat_stubs.c
          grep -qF 'ksu_compat_stubs.o' drivers/kernelsu/Kbuild \
            || echo 'obj-y += ksu_compat_stubs.o' >> drivers/kernelsu/Kbuild
          echo "Written ksu_compat_stubs.c with ksu_cred + weak sucompat stubs"

          # ── Apply Wild KSU's own GKI hook patches ──────────────────────
          echo "=== Available GKI patches ==="
          ls Wild_KSU/kernel/patches/gki/*.patch 2>/dev/null || echo "(no GKI patches found at that path)"
          for patch in Wild_KSU/kernel/patches/gki/*.patch; do
            [ -f "$patch" ] && git apply --ignore-whitespace "$patch" \
              && echo "Applied Wild KSU GKI patch: $(basename $patch)" \
              || echo "Skipped Wild KSU GKI patch: $(basename $patch)"
          done

          # ── Post-patch diagnostic ───────────────────────────────────────
          echo "=== Kbuild after modifications ==="
          cat drivers/kernelsu/Kbuild 2>/dev/null
          echo "=== ksu_cred referenced in fs/ (from GKI patches) ==="
          grep -rn "ksu_cred" fs/ 2>/dev/null | head -10 || echo "(none)"

      # ── 7. Apply SuSFS patches ────────────────────────────────────────────
      - name: Cache susfs4ksu
        if: ${{ github.event.inputs.susfs_enabled == 'true' }}
        id: susfs-cache
        uses: actions/cache@v4
        with:
          path: susfs4ksu
          key: susfs-${{ steps.shas.outputs.susfs }}

      - name: Apply SuSFS patches
        if: ${{ github.event.inputs.susfs_enabled == 'true' }}
        run: |
          if [ "${{ steps.susfs-cache.outputs.cache-hit }}" != 'true' ]; then
            SUSFS_URL="https://gitlab.com/${{ env.SUSFS_REPO }}.git"
            for branch in ${{ env.SUSFS_BRANCH }} kernel-6.1 gki-android14-6.1 main; do
              if git ls-remote --exit-code "$SUSFS_URL" "refs/heads/$branch" &>/dev/null; then
                echo "Cloning susfs4ksu branch: $branch"
                git clone --depth=1 -b "$branch" "$SUSFS_URL" susfs4ksu
                break
              fi
              echo "Branch not found: $branch"
            done
            [ -d susfs4ksu ] || { echo "::error::No valid susfs4ksu branch found"; exit 1; }
          fi

          # Apply kernel-side SuSFS patches
          cp susfs4ksu/kernel_patches/fs/susfs.c fs/
          cp susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/
          cp susfs4ksu/kernel_patches/include/linux/susfs_def.h include/linux/

          # Wire susfs.o into fs/Makefile
          echo 'obj-$(CONFIG_KSU_SUSFS) += susfs.o' >> fs/Makefile

          # Apply any .patch files provided by SuSFS
          for patch in susfs4ksu/kernel_patches/*.patch; do
            [ -f "$patch" ] && git apply "$patch" && echo "Applied: $patch" || echo "Skipped: $patch"
          done

      # ── 8. Apply WildKernels extra patches ────────────────────────────────
      - name: Cache wk_patches
        id: wkp-cache
        uses: actions/cache@v4
        with:
          path: wk_patches
          key: wkp-${{ steps.shas.outputs.wkp }}

      - name: Apply WildKernels patches
        run: |
          if [ "${{ steps.wkp-cache.outputs.cache-hit }}" != 'true' ]; then
            git clone --depth=1 \
              https://github.com/${{ env.WK_PATCHES_REPO }}.git \
              wk_patches
          fi

          # BBRv3 for kernel 6.1 (android14-6.1 is the correct target)
          git apply --ignore-whitespace wk_patches/bbr/bbrv3-android14-6.1.patch \
            && echo "Applied BBRv3 (6.1)" || echo "BBRv3 did not apply cleanly — skipped"

          # NOTE: wk_patches/wild/hooks/ is NOT applied — those patches reference
          # ksu_vfs_read_hook/ksu_input_hook/ksu_handle_execve_ksud which don't
          # exist in Wild KSU dev branch. Wild KSU's own GKI patches (applied in
          # step 6) are used instead.

          # GKI ABI bypass
          git apply --ignore-whitespace wk_patches/wild/bypass_patches/abi_bypass_gki.patch \
            && echo "Applied GKI ABI bypass" || echo "GKI ABI bypass skipped"

          # SuSFS fix patches (applied on top of the SuSFS integration from step 7)
          if [ "${{ github.event.inputs.susfs_enabled }}" = "true" ]; then
            for patch in wk_patches/ksu/susfs_fix_patches/v2.0.0/*.patch; do
              [ -f "$patch" ] && git apply "$patch" \
                && echo "Applied SuSFS fix: $patch" || echo "Skipped SuSFS fix: $patch"
            done
          fi

      # ── 9. Find defconfig ─────────────────────────────────────────────────
      - name: Locate asteroids defconfig
        run: |
          # Nothing uses vendor/ Kconfig layout — find the right defconfig
          DEFCONFIG=$(find arch/arm64/configs -name "*asteroids*" -o -name "*sm7635*" \
            | head -1 | xargs basename 2>/dev/null)
          if [ -z "$DEFCONFIG" ]; then
            # Fall back to GKI base config
            DEFCONFIG="gki_defconfig"
            echo "Warning: asteroids defconfig not found, using $DEFCONFIG"
          fi
          echo "DEFCONFIG=$DEFCONFIG" >> $GITHUB_ENV
          echo "Using defconfig: $DEFCONFIG"

      # ── 10. Configure kernel ──────────────────────────────────────────────
      - name: Configure kernel
        run: |
          make -j$(nproc) \
            O=${{ env.OUT_DIR }} \
            ARCH=${{ env.ARCH }} \
            LLVM=1 \
            LLVM_IAS=1 \
            ${{ env.DEFCONFIG }}

          # Enable KSU
          scripts/config --file ${{ env.OUT_DIR }}/.config \
            -e CONFIG_KSU \
            -e CONFIG_KSU_MANUAL_HOOK \
            -d CONFIG_TRIM_UNUSED_KSYMS \
            -e CONFIG_SECTION_MISMATCH_WARN_ONLY \
            -d CONFIG_DEBUG_INFO_BTF

          # Enable SuSFS if requested
          if [ "${{ github.event.inputs.susfs_enabled }}" = "true" ]; then
            scripts/config --file ${{ env.OUT_DIR }}/.config \
              -e CONFIG_KSU_SUSFS \
              -e CONFIG_KSU_SUSFS_SUS_PATH \
              -e CONFIG_KSU_SUSFS_SUS_MOUNT \
              -e CONFIG_KSU_SUSFS_SUS_KSTAT \
              -e CONFIG_KSU_SUSFS_SUS_OVERLAYFS \
              -e CONFIG_KSU_SUSFS_TRY_UMOUNT \
              -e CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT \
              -e CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT \
              -e CONFIG_KSU_SUSFS_SPOOF_UNAME
          fi

          # BBRv3 if BBRv3 patch applied
          scripts/config --file ${{ env.OUT_DIR }}/.config \
            -e CONFIG_TCP_CONG_BBR \
            --set-val CONFIG_DEFAULT_TCP_CONG bbr || true

          # Finalize config
          make -j$(nproc) \
            O=${{ env.OUT_DIR }} \
            ARCH=${{ env.ARCH }} \
            LLVM=1 \
            LLVM_IAS=1 \
            olddefconfig

      # ── 11. Build kernel ──────────────────────────────────────────────────
      - name: Build kernel
        run: |
          # Inject KSU source diagnostics at top of build.log so they appear
          # in the uploaded artifact — helps debug symbol visibility issues.
          {
            echo "=== sucompat.c function definitions (post-patch) ==="
            grep -n "ksu_handle_stat\|ksu_handle_faccessat\|ksu_handle_execveat_sucompat\|ksu_handle_execve_sucompat\|^static\|^void\|^int\|^bool\|^long" \
              drivers/kernelsu/sucompat.c 2>/dev/null | head -60 || echo "(sucompat.c not found)"
            echo "=== ksu.c context around sucompat include (lines 38-52) ==="
            sed -n '38,52p' drivers/kernelsu/ksu.c 2>/dev/null || grep -n "sucompat" drivers/kernelsu/ksu.c 2>/dev/null || echo "(no match)"
            echo "=== Kbuild (final) ==="
            cat drivers/kernelsu/Kbuild 2>/dev/null || echo "(no Kbuild)"
            echo "=== BUILD START ==="
          } > build.log

          make -j$(nproc) \
            O=${{ env.OUT_DIR }} \
            ARCH=${{ env.ARCH }} \
            LLVM=1 \
            LLVM_IAS=1 \
            ${{ env.KERNEL_IMAGE }} \
            2>&1 | tee -a build.log

          # Sanity check
          if [ ! -f "${{ env.OUT_DIR }}/arch/arm64/boot/${{ env.KERNEL_IMAGE }}" ]; then
            echo "::error::Kernel image not found — build failed!"
            exit 1
          fi
          echo "Build successful!"

      - name: ccache stats
        if: always()
        run: ccache --show-stats

      # ── 12. Package AnyKernel3 zip ────────────────────────────────────────
      - name: Cache AnyKernel3
        id: ak3-cache
        uses: actions/cache@v4
        with:
          path: AnyKernel3
          key: ak3-${{ steps.shas.outputs.ak3 }}

      - name: Package AnyKernel3 zip
        run: |
          if [ "${{ steps.ak3-cache.outputs.cache-hit }}" != 'true' ]; then
            git clone --depth=1 -b ${{ env.AK3_BRANCH }} ${{ env.AK3_REPO }} AnyKernel3 \
              || git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
          fi
          [ -d AnyKernel3 ] || { echo "::error::AnyKernel3 clone failed"; exit 1; }

          # Configure AnyKernel3 for asteroids / SM7635
          # Nothing Phone 3a Pro uses Android 15 GKI 2.0 layout:
          #   boot       = kernel image only (no real ramdisk)
          #   init_boot  = generic ramdisk (do NOT touch)
          #   vendor_boot = vendor ramdisk (do NOT touch)
          # do.ramdisk=0 tells AK3 to replace only the kernel blob in boot,
          # leaving init_boot/vendor_boot untouched (same fix needed on OPlus11).
          cat > AnyKernel3/anykernel.sh << 'EOF'
          # AnyKernel3 config for Nothing 3a Pro (asteroids / SM7635)
          properties() { '
          kernel.string=Wild KSU + SuSFS Kernel for Nothing 3a Pro
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          do.ramdisk=0
          device.name1=asteroids
          device.name2=Asteroids
          device.name3=AsteroidsProEEA
          device.name4=Nothing3aPro
          device.name5=A059P
          supported.versions=
          supported.patchlevels=
          '; }
          block=/dev/block/bootdevice/by-name/boot;
          is_slot_device=1;
          ramdisk_compression=auto;
          patch_vbmeta_flag=0;
          EOF

          # Build ARM64 busybox (Nothing OS SM7635 has no 32-bit compat)
          sudo apt-get install -y gcc-aarch64-linux-gnu 2>/dev/null || true
          curl -Lo busybox.tar.bz2 https://busybox.net/downloads/busybox-1.36.1.tar.bz2
          tar xjf busybox.tar.bz2
          cd busybox-1.36.1
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
          scripts/config --enable CONFIG_STATIC
          scripts/config --disable CONFIG_TC
          scripts/config --disable CONFIG_FEATURE_TC_INGRESS
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc)
          cp busybox ../AnyKernel3/tools/busybox
          cd ..
          chmod +x AnyKernel3/tools/busybox
          echo "busybox arch: $(file AnyKernel3/tools/busybox)"

          cp ${{ env.OUT_DIR }}/arch/arm64/boot/${{ env.KERNEL_IMAGE }} AnyKernel3/

          # Build the zip
          ZIPNAME="WildKSU-SuSFS-asteroids-${{ github.event.inputs.kernel_version }}-$(date +%Y%m%d-%H%M).zip"
          cd AnyKernel3
          zip -r9 "../${ZIPNAME}" . -x .git\* -x README.md
          cd ..
          echo "ZIPNAME=${ZIPNAME}" >> $GITHUB_ENV
          echo "Packaged: ${ZIPNAME}"

      # ── 13. Upload build log (always) ─────────────────────────────────────
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: build.log
          retention-days: 7

      # ── 14. Upload kernel artifacts ───────────────────────────────────────
      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: asteroids-kernel-${{ github.run_number }}
          path: |
            ${{ env.ZIPNAME }}
            ${{ env.OUT_DIR }}/arch/arm64/boot/${{ env.KERNEL_IMAGE }}
          retention-days: 14

      # ── 15. Create GitHub Release ─────────────────────────────────────────
      - name: Create GitHub Release
        if: ${{ github.event.inputs.release == 'true' }}
        uses: ncipollo/release-action@v1
        with:
          tag: asteroids-${{ github.event.inputs.kernel_version }}-r${{ github.run_number }}
          name: "Wild KSU + SuSFS | Nothing 3a Pro | ${{ github.event.inputs.kernel_version }}"
          body: |
            ## Nothing Phone (3a) Pro — Wild KSU Kernel
            **Device:** Nothing 3a Pro (asteroids / SM7635)
            **Kernel:** ${{ github.event.inputs.kernel_version }}
            **Root:** Wild KSU (`${{ github.event.inputs.ksu_branch }}`)
            **SuSFS:** ${{ github.event.inputs.susfs_enabled }}
            **Build:** #${{ github.run_number }} — ${{ github.sha }}

            ### Flash Instructions
            1. Have Magisk/KSU/APatch installed for recovery access
            2. Flash the AnyKernel3 ZIP via your recovery or KernelFlasher
            3. Install the Wild KSU Manager APK from [WildKernels/Wild_KSU](https://github.com/WildKernels/Wild_KSU/releases)
            4. Reboot

            ### Features
            - Wild KSU root
            - SuSFS root hiding
            - BBRv3 congestion control (if patch applied cleanly)

            > ⚠️ Flash at your own risk. Backup first.
          artifacts: ${{ env.ZIPNAME }}
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
